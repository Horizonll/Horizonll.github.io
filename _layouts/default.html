<!doctype html>
<html lang="en">
  <head>
    {% assign profile = site.author_profile %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024" />
    {% seo %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "{{ profile.name }}",
        "alternateName": "{{ profile.alternate_name }}",
        "email": "mailto:{{ profile.email }}",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "Tsinghua University"
        },
        "url": "{{ site.url }}",
        "sameAs": [
          "https://github.com/{{ profile.github }}",
          "{{ profile.scholar }}"
        ]
      }
    </script>
    <link
      rel="icon"
      href="{{ '/favicon.ico' | relative_url }}"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&text=%E4%BD%95%E7%9D%BF%E6%B3%BD%E3%80%8C%E3%80%8D&family=Source+Serif+4:wght@600&family=Titillium+Web&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      href="{{ '/img/1.webp' | relative_url }}"
      type="image/webp"
    />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav id="site-nav" class="site-nav" aria-label="Page sections">
        <div class="site-nav-inner">
          <a class="nav-brand" href="#about">{{ profile.name }}</a>
          <div class="nav-links">
            <a class="nav-link" href="#about">About</a>
            <a class="nav-link" href="#news">News</a>
            <a class="nav-link" href="#education">Education</a>
            <a class="nav-link" href="#publications">Publications</a>
            <a class="nav-link" href="#internships">Internships</a>
            <a class="nav-link" href="#awards">Awards</a>
            <a class="nav-link" href="#talks">Talks</a>
            <a class="nav-link" href="#teaching">Teaching</a>
            <a class="nav-link" href="#service">Service</a>
          </div>
        </div>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
